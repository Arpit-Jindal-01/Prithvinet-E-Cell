databases:
  - name: prithvinet-db
    databaseName: prithvinet
    user: prithvinet
    plan: free

services:
  - type: web
    name: prithvinet-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prithvinet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true        # Render auto-generates a secure random secret
      - key: GROQ_API_KEY
        sync: false                # Set manually in Render dashboard
      - key: WAQI_TOKEN
        value: demo                # Free public token; replace with your own if needed
      - key: FRONTEND_URL
        sync: false                # Set to your Vercel URL after deploying frontend
